<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 320" width="1320" height="320" role="img" aria-labelledby="ct cd"><title id="ct">What This Demonstrates</title><desc id="cd">Four cards: Business Problem, Business Outcomes, Deliverables, Reusable Components</desc>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/></filter></defs>
<rect width="1320" height="320" rx="14" fill="#fcfcfb"/>

<!-- Card 1: Business Problem -->
<rect x="40" y="40" width="296" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<rect x="40" y="40" width="296" height="48" rx="12" fill="#fef2f2"/>
<rect x="40" y="76" width="296" height="12" fill="#fef2f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#991b1b" x="60" y="70">BUSINESS PROBLEM</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="60" y="110">UK online gift retailer with 1.07M</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="60" y="130">transactions (Dec 2009 - Dec 2011).</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="60" y="155">22,523 duplicate rows inflated Kaggle</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="60" y="175">benchmarks by ~GBP 377k.</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="60" y="200">Cancellations, postage, and bank</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="60" y="220">charges mixed with sales data.</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="60" y="245">Goal: numbers a finance lead can sign</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="60" y="265">off, queryable without loosening governance.</text>

<!-- Card 2: Business Outcomes -->
<rect x="356" y="40" width="296" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<rect x="356" y="40" width="296" height="48" rx="12" fill="#dcfce7"/>
<rect x="356" y="76" width="296" height="12" fill="#dcfce7"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#166534" x="376" y="70">BUSINESS OUTCOMES</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="376" y="110">GBP 18.85M net revenue verified</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="376" y="130">with zero-tolerance parity (PySpark = SQL).</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="376" y="155">+32.1% dotcom growth identified as</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="376" y="175">100% of net growth driver.</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="376" y="200">63.2% revenue from top 10% accounts.</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="376" y="220">Q4 holiday = 38% of annual revenue.</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="376" y="245">Guest checkout channel (anonymous</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="376" y="265">web) is the growth engine to formalize.</text>

<!-- Card 3: Deliverables -->
<rect x="672" y="40" width="296" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<rect x="672" y="40" width="296" height="48" rx="12" fill="#dbeafe"/>
<rect x="672" y="76" width="296" height="12" fill="#dbeafe"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1e40af" x="692" y="70">DELIVERABLES</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="692" y="110">Medallion pipeline (Bronze/Silver/Gold)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="692" y="130">Dual-engine parity validation</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="692" y="150">UC governance (mask + row filter)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="692" y="170">MLflow model (0.8899 ROC-AUC)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="692" y="190">Genie agent (governed NL analytics)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="692" y="210">MCP server (6 purpose-built tools)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="692" y="230">3 UC metric views</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="692" y="250">5 health monitoring alerts</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="692" y="270">7 Architecture Decision Records</text>

<!-- Card 4: Reusable Components -->
<rect x="988" y="40" width="296" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<rect x="988" y="40" width="296" height="48" rx="12" fill="#fef9c3"/>
<rect x="988" y="76" width="296" height="12" fill="#fef9c3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#854d0e" x="1008" y="70">REUSABLE COMPONENTS</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1008" y="110">Dedup pattern (window function)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1008" y="130">Quarantine pattern (non-failing DQ)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1008" y="150">UC mask + row filter functions</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1008" y="170">MCP tool wrapper (FastMCP + MLflow)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1008" y="190">Metric view YAML templates</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1008" y="210">DAB bundle structure</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1008" y="230">Health monitoring alerts</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1008" y="250">Parity validation harness</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1008" y="270">Genie agent config (as code)</text>
</svg>