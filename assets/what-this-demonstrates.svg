<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1024" y="148">Quarantine pattern</text>
<circle cx="1012" cy="176" r="3" fill="#ca8a04"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1024" y="181">Unity Catalog Mask + row filter functions</text>
<circle cx="1012" cy="209" r="3" fill="#ca8a04"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1024" y="214">Metric view YAML templates</text>
<circle cx="1012" cy="242" r="3" fill="#ca8a04"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1024" y="247">DAB bundle structure</text>
<circle cx="1012" cy="275" r="3" fill="#ca8a04"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1024" y="280">Health monitoring alerts</text>
<circle cx="1012" cy="308" r="3" fill="#ca8a04"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="1024" y="313">Parity validation harness</text>
