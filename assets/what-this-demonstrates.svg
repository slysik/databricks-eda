<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 360" width="1320" height="360" role="img" aria-labelledby="ct cd"><title id="ct">What This Demonstrates</title><desc id="cd">Four cards: Business Problem, Business Outcomes, Deliverables, Reusable Components</desc>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/></filter></defs>
<rect width="1320" height="360" rx="14" fill="#fcfcfb"/>

<!-- Card 1: Business Problem -->
<rect x="40" y="40" width="296" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<rect x="40" y="40" width="296" height="48" rx="12" fill="#fef2f2"/>
<rect x="40" y="76" width="296" height="12" fill="#fef2f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#991b1b" x="60" y="70">BUSINESS PROBLEM</text>
<circle cx="64" cy="110" r="3" fill="#991b1b"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="76" y="115">Executives need answers without knowing</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="76" y="135">SQL or waiting on a report queue</text>
<circle cx="64" cy="163" r="3" fill="#991b1b"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="76" y="168">Ability to ask "Why"</text>
<circle cx="64" cy="196" r="3" fill="#991b1b"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="76" y="201">Self-service today means either</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="76" y="221">ungoverned spreadsheets</text>
<line x1="56" y1="245" x2="320" y2="245" stroke="#e2e8f0" stroke-width="1"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#991b1b" x="60" y="270">Goal: governed, conversational analytics</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#991b1b" x="60" y="290">an executive can use directly and</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#991b1b" x="60" y="310">create their own Dashboard Analytics</text>

<!-- Card 2: Business Outcomes -->
<rect x="356" y="40" width="296" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<rect x="356" y="40" width="296" height="48" rx="12" fill="#dcfce7"/>
<rect x="356" y="76" width="296" height="12" fill="#dcfce7"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#166534" x="376" y="70">BUSINESS OUTCOMES</text>
<circle cx="380" cy="110" r="3" fill="#16a34a"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="392" y="115">Fewer ad-hoc report requests</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" x="392" y="135">analyst hours back on real work</text>
<circle cx="380" cy="163" r="3" fill="#16a34a"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="392" y="168">Lower BI licensing costs</text>
<circle cx="380" cy="196" r="3" fill="#16a34a"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="392" y="201">One Databricks platform</text>
<circle cx="380" cy="229" r="3" fill="#16a34a"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="392" y="234">Freedom to explore without losing</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" x="392" y="254">governance, guardrails stay on</text>

<!-- Card 3: Deliverables -->
<rect x="672" y="40" width="296" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<rect x="672" y="40" width="296" height="48" rx="12" fill="#dbeafe"/>
<rect x="672" y="76" width="296" height="12" fill="#dbeafe"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1e40af" x="692" y="70">DELIVERABLES</text>
<circle cx="696" cy="110" r="3" fill="#2563eb"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="708" y="115">Medallion pipeline: Bronze, Silver, Gold</text>
<circle cx="696" cy="143" r="3" fill="#2563eb"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="708" y="148">Data quality checks built into process</text>
<circle cx="696" cy="176" r="3" fill="#2563eb"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="708" y="181">Unity Catalog Data &amp; AI governance</text>
<circle cx="696" cy="209" r="3" fill="#2563eb"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b" x="708" y="214">Genie Agent over governed gold data</text>

<!-- Card 4: Reusable Components -->
<rect x="988" y="40" width="296" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<rect x="988" y="40" width="296" height="48" rx="12" fill="#fef9c3"/>
<rect x="988" y="76" width="296" height="12" fill="#fef9c3"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#854d0e" x="1008" y="70">REUSABLE COMPONENTS</text>
<circle cx="1012" cy="110" r="3" fill="#ca8a04"/>
