<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 460" width="1320" height="460" role="img" aria-labelledby="t d"><title id="t">EDA Retail Lakehouse architecture</title><desc id="d">A Unity Catalog source table flows into Lakeflow, where Bronze, Silver and Gold layers are built, then into governed Gold tables. Genie, an MCP server and an MLflow model read the Gold tables. A governance panel above lists Unity Catalog access controls, Delta quality checks and dual-engine parity.</desc>
