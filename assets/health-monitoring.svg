<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 520" width="1320" height="520" role="img" aria-labelledby="ht hd"><title id="ht">EDA Health Monitoring Dashboard</title><desc id="hd">Five health alerts monitoring pipeline, data freshness, quality, metric views, and row stability. Each shows status, check, and schedule.</desc>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1320" height="520" rx="14" fill="#fcfcfb"/>

<!-- Title -->
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a" x="40" y="52">EDA Health Monitoring</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" x="40" y="72">Daily alerts at 9 AM ET · email on failure · lysiak043@gmail.com</text>

<!-- Alert 1: Pipeline Health -->
<rect x="40" y="100" width="240" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<circle cx="60" cy="124" r="6" fill="#16a34a"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" x="74" y="129">Pipeline Health</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="56" y="155">system.lakeflow.job_run_timeline</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="56" y="175">Check: job ran in last 24h?</text>
<rect x="56" y="190" width="60" height="24" rx="4" fill="#dcfce7"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#166534" x="68" y="206">HEALTHY</text>
<rect x="124" y="190" width="60" height="24" rx="4" fill="#fef2f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#991b1b" x="136" y="206">STALE</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" x="56" y="240">Trigger: EQUAL 1 (healthy)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" x="56" y="258">Schedule: 0 0 9 * * ? (9 AM ET)</text>

<!-- Alert 2: Data Freshness -->
<rect x="300" y="100" width="240" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<circle cx="320" cy="124" r="6" fill="#16a34a"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" x="334" y="129">Data Freshness</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="316" y="155">retail_prod.gold.gold_daily_kpis</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="316" y="175">Check: latest date &gt; yesterday?</text>
<rect x="316" y="190" width="60" height="24" rx="4" fill="#dcfce7"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#166534" x="328" y="206">FRESH</text>
<rect x="384" y="190" width="60" height="24" rx="4" fill="#fef2f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#991b1b" x="396" y="206">STALE</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" x="316" y="240">Trigger: EQUAL 1 (fresh)</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" x="316" y="258">Schedule: 0 0 9 * * ? (9 AM ET)</text>

<!-- Alert 3: Quarantine Rate -->
<rect x="560" y="100" width="240" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<circle cx="580" cy="124" r="6" fill="#16a34a"/>
