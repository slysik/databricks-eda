<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="576" y="155">sales_quarantine / sales_cleaned</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="576" y="175">Check: rate &le; 15%?</text>
<rect x="576" y="190" width="100" height="24" rx="4" fill="#dcfce7"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#166534" x="588" y="206">&le; 15% OK</text>
<rect x="684" y="190" width="100" height="24" rx="4" fill="#fef2f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#991b1b" x="696" y="206">&gt; 15% ALERT</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" x="576" y="240">Trigger: LESS_THAN_OR_EQUAL 15</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" x="576" y="258">Schedule: 0 0 9 * * ? (9 AM ET)</text>

<!-- Alert 4: Row Count Stability -->
<rect x="820" y="100" width="240" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<circle cx="840" cy="124" r="6" fill="#16a34a"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" x="854" y="129">Row Count Stability</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="836" y="155">silver.sales_cleaned</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="836" y="175">Check: deviation &le; 10% from 1,033,034?</text>
<rect x="836" y="190" width="90" height="24" rx="4" fill="#dcfce7"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#166534" x="848" y="206">&le; 10% STABLE</text>
<rect x="934" y="190" width="110" height="24" rx="4" fill="#fef2f2"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#991b1b" x="946" y="206">&gt; 10% DEVIATION</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" x="836" y="240">Trigger: LESS_THAN_OR_EQUAL 10</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" x="836" y="258">Schedule: 0 0 9 * * ? (9 AM ET)</text>

<!-- Alert 5: Metric View Health -->
<rect x="40" y="310" width="240" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<circle cx="60" cy="334" r="6" fill="#16a34a"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" x="74" y="339">Metric View Health</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="56" y="365">metrics.daily_kpis</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="56" y="383">metrics.customer_features</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="56" y="401">metrics.sales_by_country</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="56" y="421">Check: all views return rows?</text>
<rect x="56" y="436" width="80" height="24" rx="4" fill="#dcfce7"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#166534" x="68" y="452">ALL &gt; 0 OK</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" x="56" y="476">Trigger: EQUAL 1 (all healthy)</text>

<!-- Daily Health Check Job -->
<rect x="300" y="310" width="240" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
<circle cx="320" cy="334" r="6" fill="#2563eb"/>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" x="334" y="339">Daily Health Check Job</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="316" y="365">Notebook: 01_health_checks.py</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="316" y="383">Runs all 5 checks + logs results</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="316" y="401">Schedule: 8 AM ET daily</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="316" y="421">Compute: Serverless</text>
