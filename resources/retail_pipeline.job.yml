# Job: EDA Retail Lakehouse Pipeline
# Runs: Bronze → Silver → Gold → Governance → Genie

resources:
  jobs:
    eda_retail_pipeline:
      name: "EDA Retail Lakehouse Pipeline"
      description: "Ingest, dedup, quarantine, gold, governance, genie"
      tags:
        project: eda-retail

      # All tasks use serverless compute (no cluster management)
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: "${workspace.file_path}/src/01_bronze_ingest"
            base_parameters:
              catalog: "${var.catalog}"
          libraries:
            - pypi:
                package: "openpyxl>=3.1.0"

        - task_key: silver_clean
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: "${workspace.file_path}/src/02_silver_clean"
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_clean
          notebook_task:
            notebook_path: "${workspace.file_path}/src/03_gold_aggregate"
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: apply_governance
          depends_on:
            - task_key: gold_aggregate
          notebook_task:
            notebook_path: "${workspace.file_path}/src/04_governance"
            base_parameters:
              catalog: "${var.catalog}"
              warehouse_id: "${var.warehouse_id}"

        - task_key: create_genie
          depends_on:
            - task_key: apply_governance
          notebook_task:
            notebook_path: "${workspace.file_path}/src/05_genie_agent"
            base_parameters:
              catalog: "${var.catalog}"
              warehouse_id: "${var.warehouse_id}"
              genie_space_name: "${var.genie_space_name}"

      timeout_seconds: 1800