# Databricks Asset Bundle: EDA Retail Lakehouse Blueprint
# Deploys notebooks, Genie agent, and a scheduled pipeline job
#
# KNOWN ISSUES (from code audit):
# - SDP pipeline (retail_sdp) writes to {catalog}.bronze_sdp/silver_sdp/gold_sdp
#   which nothing reads. Notebook job writes to {catalog}.bronze/silver/gold.
#   Pick one path for production; the other is a demo/learning artifact.
# - SDP schema: "bronze" is dead config — transformations fully-qualify their targets.

bundle:
  name: eda-retail-lakehouse

# Use your authenticated profile
workspace:
  profile: primary-aws-user

# Variable declarations (assigned per target below)
variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: retail_prod
  warehouse_id:
    description: "SQL warehouse ID for queries"
    default: "4bbaafe9538467a0"
  genie_space_name:
    description: "Genie agent name"
    default: "EDA Governed Gold Analytics"

# ─── RESOURCES: What gets deployed ───────────────────────────────────────────
resources:
  pipelines:
    retail_sdp:
      name: "retail-sdp"
      catalog: "${var.catalog}"
      schema: "bronze"
      serverless: true
      continuous: false
      configuration:
        catalog: "${var.catalog}"
      libraries:
        - glob:
            include: "${workspace.file_path}/src/pipelines/retail_sdp/transformations/**"

  jobs:
    eda_retail_pipeline:
      name: "EDA Retail Lakehouse Pipeline"
      description: "Ingest, dedup, quarantine, gold, governance, genie"
      tags:
        project: eda-retail

      # All tasks use serverless compute
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: "${workspace.file_path}/src/01_bronze_ingest"
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: silver_clean
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: "${workspace.file_path}/src/02_silver_clean"
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_clean
          notebook_task:
            notebook_path: "${workspace.file_path}/src/03_gold_aggregate"
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: apply_governance
          depends_on:
            - task_key: gold_aggregate
          notebook_task:
            notebook_path: "${workspace.file_path}/src/04_governance"
            base_parameters:
              catalog: "${var.catalog}"
              warehouse_id: "${var.warehouse_id}"

        - task_key: create_genie
          depends_on:
            - task_key: apply_governance
          notebook_task:
            notebook_path: "${workspace.file_path}/src/05_genie_agent"
            base_parameters:
              catalog: "${var.catalog}"
              warehouse_id: "${var.warehouse_id}"
              genie_space_name: "${var.genie_space_name}"

      timeout_seconds: 1800

# ─── TARGETS: Where it deploys ───────────────────────────────────────────────
targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: primary-aws-user
    variables:
      catalog: retail_prod
      warehouse_id: "4bbaafe9538467a0"  # Shared starter warehouse (free tier)
      genie_space_name: "EDA Governed Gold Analytics (dev)"

  prod:
    mode: production
    workspace:
      profile: primary-aws-user
      root_path: /Workspace/Users/lysiak043@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_prod
      # IMPORTANT: Use a separate warehouse for prod to avoid dev/prod contention.
      # Create a dedicated prod warehouse in the Databricks UI and paste its ID here.
      warehouse_id: "4bbaafe9538467a0"
      genie_space_name: "EDA Governed Gold Analytics"

# ─── SYNC: Local files to upload ─────────────────────────────────────────────
sync:
  paths:
    - src